<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JGVRP Speedometer HUD - LFA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="hud-wrap">
    <div class="cluster" id="hud" data-theme="lfa">

      <!-- Dial, gauge samping, jam, engine% digambar oleh script.js -->
      <svg id="dial" class="dial" viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg"></svg>

      <!-- Panel tengah (lingkaran gelap): speed MPH, gear, odometer -->
      <div class="center">
        <div id="speed-display" class="speed"><span class="dim">00</span><span class="bright">0</span></div>
        <div class="unit">MPH</div>
        <i class="hline"></i>
        <div class="gear-val" id="gear">N</div>
        <div class="c-lbl">GEAR</div>
        <div class="odo"><span class="c-lbl">ODO</span><span class="odo-val" id="odometer">0.0</span><span class="c-lbl">MI</span></div>
      </div>

      <!-- Indikator (kanan bawah): seatbelt, lampu, mesin -->
      <div id="seatbelts" class="icon-item warn" style="left:664px;top:349px" title="Seatbelt">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="4" r="2.2" fill="currentColor" stroke="none"/>
          <path d="M8 22v-5.5L7 11.5C7 9.6 8.4 8 10.2 8h3.6C15.6 8 17 9.6 17 11.5l-1 5V22"/><path d="M9 8.5l7.5 10"/>
        </svg>
      </div>
      <div id="headlight" class="icon-item" style="left:634px;top:409px" title="Headlight">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 4h2a8 8 0 0 1 0 16h-2z" fill="currentColor" fill-opacity=".15"/>
          <g class="beam-low"><path d="M9 5L2 7.5M9 9L2 11.5M9 13L2 15.5M9 17L2 19.5"/></g>
          <g class="beam-high"><path d="M9 6H2M9 10H2M9 14H2M9 18H2"/></g>
        </svg>
      </div>
      <div id="enginelamp" class="icon-item" style="left:592px;top:461px" title="Engine">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v8"/><path d="M7 6.5a7 7 0 1 0 10 0"/>
        </svg>
      </div>

    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
